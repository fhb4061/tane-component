name: CI
run-name: ${{ github.actor }} is running CI 🚀
on: [push]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v5
            - name: Setup node.js
              uses: actions/setup-node@v5
              with:
                cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm run build